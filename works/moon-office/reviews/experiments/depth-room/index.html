<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单图空间重建 · 技术实验</title>
<style>body{margin:0;background:#142220;color:#e9e0c9;font:15px/1.7 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:baseline;gap:20px}h1{font-size:23px;font-weight:500;margin:0}small{color:#b6ab91}p{max-width:930px;color:#c1baa5;font-size:13px}#stage{position:relative;width:100%;aspect-ratio:1.6;background:#0a1211;border:1px solid #4b5a4f;margin:20px 0;overflow:hidden}canvas,#original{position:absolute;width:100%;height:100%;inset:0;display:block}#original{object-fit:contain;display:none}#status{position:absolute;left:18px;bottom:12px;background:#0f201fcc;padding:4px 10px;font-size:11px;pointer-events:none}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}button{font:inherit;border:1px solid #68785f;background:#284139;color:#ece1c8;padding:9px 16px;cursor:pointer}button[aria-pressed=true]{background:#b28258;color:#fff3d8}button:focus-visible,input:focus-visible{outline:2px solid #efc57e;outline-offset:4px}input{width:230px;accent-color:#cea16c}label{display:flex;gap:12px;align-items:center}output{font-variant-numeric:tabular-nums;min-width:44px}details{margin-top:24px;font-size:12px;color:#afa78f}summary{cursor:pointer}.error{color:#f7ac91}@media(max-width:600px){main{padding:17px}header{display:block}h1{font-size:20px}input{width:180px}button{font-size:12px;padding:9px 12px}#stage{aspect-ratio:1.6}}</style></head>
<body><main><header><h1>把一张画，放进真实的视角变化里</h1><small>MoGe-2 · CPU 实测 · 技术实验</small></header><p>先看原图，再轻轻转动视角；最后试试更大的转角，观察人物轮廓与遮挡处。这里只重建了原图可见的表面，没有补出背面、独立角色或可拿起的物件。</p><div id="stage"><img id="original" src="office-original.webp" alt="原始拾遗司插画"><div id="status" role="status">正在载入实际重建的三维表面…</div></div><div class="controls"><button id="mode" aria-pressed="false">查看原始插画</button><label>转动 <input id="yaw" type="range" min="-28" max="28" step="0.5" value="0" aria-label="视角角度"><output id="angle">0°</output></label><button id="small">小幅转头 4°</button><button id="large">检查侧面 18°</button><button id="reset">回到原视角</button><button id="cut" aria-pressed="false">切开深度断层</button><button id="wire" aria-pressed="false">显示几何网格</button></div><details><summary>实验记录与边界</summary><p id="metrics"></p><p>几何由 Microsoft MoGe-2 小模型从本作插画估计，默认连接整个可见表面，可切换为沿深度断层切开；前者会拉伸、后者会暴露缺面。深度尺度是模型估计，原场景是幻想插画，没有真实测量基准。这个实验只判断小幅视点变化的潜力与边界，不代表完整可探索的房间。完整结果见同目录 README.md 与 metrics.json。</p></details></main><script type="module" src="viewer.js"></script></body></html>
